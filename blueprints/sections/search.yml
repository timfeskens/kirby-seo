type: fields
fields:
  searchHeading:
    type: headline
    label:
      en: Search engines
      nl: Zoekmachines
  metaTemplate:
    label:
      en: Title pattern
      nl: Titelpatroon
    type: timfeskens-seo-template
    default: '{{ title }} - {{ site.title }}'
    placeholder: '{{ title }} - {{ site.title }}'
    help:
      en: Insert title variables with the buttons. Type separators or other text between them. Use the code view to edit the stored pattern directly.
      nl: Voeg titelvariabelen toe met de knoppen. Typ scheidingstekens of andere tekst ertussen. Bewerk het opgeslagen patroon direct in de codeweergave.
  metaDescription:
    label:
      en: Meta description
      nl: Meta-omschrijving
    type: timfeskens-seo-textarea
    buttons: false
