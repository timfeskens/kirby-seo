type: fields
fields:
  metaTemplate:
    label:
      en: Title pattern
      nl: Titelpatroon
    type: timfeskens-seo-text
    default: '{{ title }} - {{ site.title }}'
    placeholder: '{{ title }} - {{ site.title }}'
    help:
      en: 'Use {{ title }}, {{ page.title }} and {{ site.title }}. Default: {{ title }} - {{ site.title }}.'
      nl: 'Gebruik {{ title }}, {{ page.title }} en {{ site.title }}. Standaard: {{ title }} - {{ site.title }}.'
  metaDescription:
    label:
      en: Meta description
      nl: Meta-omschrijving
    type: timfeskens-seo-textarea
    buttons: false
  ogTemplate:
    label:
      en: Social title pattern
      nl: Titelpatroon voor sociale media
    type: timfeskens-seo-text
    default: '{{ title }}'
    placeholder: '{{ title }}'
    help: '{{ title }}'
  ogDescription:
    label:
      en: Social description
      nl: Omschrijving voor sociale media
    type: timfeskens-seo-textarea
    buttons: false
  ogSiteName:
    label:
      en: Social site name
      nl: Sitenaam voor sociale media
    type: timfeskens-seo-text
    default: '{{ site.title }}'
    placeholder: '{{ site.title }}'
  ogImage:
    label:
      en: Social image
      nl: Afbeelding voor sociale media
    type: files
    multiple: false
    query: site.files.add(site.index.files).filterBy('type', 'image')
    help:
      en: Cropped to 1200 × 630 pixels. Leave enough space around your subject.
      nl: Wordt bijgesneden naar 1200 × 630 pixels. Laat genoeg ruimte rond het onderwerp.
  twitterCardType:
    label:
      en: Twitter/X card
      nl: Twitter/X-kaart
    type: timfeskens-seo-select
    default: default
    placeholder:
      en: Automatic (large image when available, otherwise compact)
      nl: Automatisch (grote afbeelding indien beschikbaar, anders compact)
    options:
      default:
        en: Automatic (large image when available, otherwise compact)
        nl: Automatisch (grote afbeelding indien beschikbaar, anders compact)
      summary: Compact
      summary_large_image:
        en: Large image
        nl: Grote afbeelding
  robots:
    type: group
    fields:
      robotsIndex:
        label:
          en: Indexing
          nl: Indexeren
        extends: fields/seo-robots
        width: 1/2
      robotsFollow:
        label:
          en: Follow links
          nl: Links volgen
        extends: fields/seo-robots
        width: 1/2
      robotsImageindex:
        label:
          en: Image indexing
          nl: Afbeeldingen indexeren
        extends: fields/seo-robots
      robotsSnippet:
        label:
          en: Text snippets
          nl: Tekstfragmenten tonen
        extends: fields/seo-robots
  socialMediaAccounts:
    label:
      en: Social profiles
      nl: Sociale media
    type: object
    fields:
      twitter:
        label: Twitter/X
        type: url
      facebook:
        label: Facebook
        type: url
      instagram:
        label: Instagram
        type: url
      youtube:
        label: YouTube
        type: url
      linkedin:
        label: LinkedIn
        type: url
