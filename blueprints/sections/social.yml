type: fields
fields:
  socialHeading:
    type: headline
    label:
      en: Social sharing
      nl: Delen op sociale media
  ogTemplate:
    label:
      en: Social title pattern
      nl: Titelpatroon voor sociale media
    type: timfeskens-seo-template
    default: '{{ title }}'
    placeholder: '{{ title }}'
    help:
      en: Insert title variables or type text. The stored pattern stays compatible with existing content.
      nl: Voeg titelvariabelen toe of typ tekst. Het opgeslagen patroon blijft compatibel met bestaande inhoud.
  ogDescription:
    label:
      en: Social description
      nl: Omschrijving voor sociale media
    type: timfeskens-seo-textarea
    buttons: false
  ogSiteName:
    label:
      en: Social site name
      nl: Sitenaam voor sociale media
    type: timfeskens-seo-template
    default: '{{ site.title }}'
    placeholder: '{{ site.title }}'
    help:
      en: Insert title variables or type text. The stored pattern stays compatible with existing content.
      nl: Voeg titelvariabelen toe of typ tekst. Het opgeslagen patroon blijft compatibel met bestaande inhoud.
  ogImage:
    label:
      en: Social image
      nl: Afbeelding voor sociale media
    type: files
    multiple: false
    query: site.files.add(site.index.files).filterBy('type', 'image')
    help:
      en: By default, cropped to 1200 × 630 pixels. Leave enough space around your subject.
      nl: Wordt standaard bijgesneden naar 1200 × 630 pixels. Laat genoeg ruimte rond het onderwerp.
  cropOgImage:
    label:
      en: Crop social image
      nl: Sociale afbeelding bijsnijden
    type: timfeskens-seo-select
    default: default
    options:
      default:
        en: Inherit / automatic (crop by default)
        nl: Overnemen / automatisch (standaard bijsnijden)
      'true':
        en: Crop to 1200 × 630
        nl: Bijsnijden naar 1200 × 630
      'false':
        en: Keep original image
        nl: Oorspronkelijke afbeelding behouden
  twitterCardType:
    label:
      en: Twitter/X card
      nl: Twitter/X-kaart
    type: timfeskens-seo-select
    default: default
    placeholder:
      en: Automatic (large image when available, otherwise compact)
      nl: Automatisch (grote afbeelding indien beschikbaar, anders compact)
    options:
      default:
        en: Automatic (large image when available, otherwise compact)
        nl: Automatisch (grote afbeelding indien beschikbaar, anders compact)
      summary: Compact
      summary_large_image:
        en: Large image
        nl: Grote afbeelding
